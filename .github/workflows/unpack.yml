name: Extract MAMOUN POS source
on:
  push:
    paths:
      - pos-code.tar.xz
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install source files from trusted archive
        run: |
          set -euo pipefail
          tar -tJf pos-code.tar.xz | grep -Ev '^\./(\.\./|/)' >/dev/null
          tar -xJf pos-code.tar.xz
          rm pos-code.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Install standalone MAMOUN POS application"
            git push origin HEAD:main
          fi
